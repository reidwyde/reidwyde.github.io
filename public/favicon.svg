      <stop offset="0" stop-color="#3b82ff"/>
      <stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b1220"/>
  <!-- subtle grid nod -->
  <g stroke="#1c2740" stroke-width="1">
